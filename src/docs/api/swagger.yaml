openapi: '3.0.0'
info:
  version: 1.0.0
  title: API de Gerenciamento de Usuários e Pratos
  description: Esta é uma API para gerenciar usuários e pratos com autenticação JWT.
servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Users
    description: Operações relacionadas a usuários
  - name: Pratos
    description: Operações relacionadas a pratos
  - name: Auth
    description: Operações de autenticação

paths:
  /api/users:
    post:
      summary: Cria um novo usuário
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: O usuário foi criado com sucesso!
        500:
          description: Algum erro aconteceu
  /api/users/{id}:
    get:
      summary: Retorna um usuário pelo ID
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: O ID do usuário
      responses:
        200:
          description: Detalhes do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: Usuário não encontrado
        500:
          description: Algum erro aconteceu
    put:
      summary: Atualiza um usuário pelo ID
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: O ID do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: O usuário foi atualizado com sucesso!
        404:
          description: Usuário não encontrado
        500:
          description: Algum erro aconteceu
    delete:
      summary: Deleta um usuário pelo ID
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: O ID do usuário
      responses:
        200:
          description: O usuário foi deletado com sucesso!
        404:
          description: Usuário não encontrado
        500:
          description: Algum erro aconteceu
  /api/pratos:
    post:
      summary: Cria um novo prato
      tags: [Pratos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prato'
      responses:
        201:
          description: O prato foi criado com sucesso!
        500:
          description: Algum erro aconteceu
    get:
      summary: Retorna todos os pratos
      tags: [Pratos]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Uma lista de pratos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prato'
        500:
          description: Algum erro aconteceu
  /api/pratos/{id}:
    get:
      summary: Retorna um prato pelo ID
      tags: [Pratos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: O ID do prato
      responses:
        200:
          description: Detalhes do prato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prato'
        404:
          description: Prato não encontrado
        500:
          description: Algum erro aconteceu
    put:
      summary: Atualiza um prato pelo ID
      tags: [Pratos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: O ID do prato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prato'
      responses:
        200:
          description: O prato foi atualizado com sucesso!
        404:
          description: Prato não encontrado
        500:
          description: Algum erro aconteceu
    delete:
      summary: Deleta um prato pelo ID
      tags: [Pratos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: O ID do prato
      responses:
        200:
          description: O prato foi deletado com sucesso!
        404:
          description: Prato não encontrado
        500:
          description: Algum erro aconteceu
  /api/login:
    post:
      summary: Autentica um usuário e retorna um token JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        200:
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
        401:
          description: Credenciais inválidas
        500:
          description: Algum erro aconteceu
  /api/refresh-token:
    post:
      summary: Gera um novo token JWT
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Token JWT atual
              example:
                refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        200:
          description: Novo token gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
        401:
          description: Token inválido ou expirado
        500:
          description: Algum erro aconteceu
  /api/pedidos:
    get:
      summary: Lista todos os pedidos
      security: 
       bearerAuth: [] 
      tags: [Pedidos]
      responses:
        200:
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        401: 
         description: Token inválido ou ausente 
        403: 
         description: Sem permissão 
    post:
      summary: Cria um pedido
      security: 
       bearerAuth: [] 
      tags: [Pedidos]
      requestBody:
        required: true
        content:
          application/json:
            schema: 
             $ref: '#/components/schemas/CreatePedido' 
            example:
              usuarioId: "u-123"
              itens:
                - pratoId: "p-1"
                  quantidade: 2
                  precoUnitario: 10
      responses:
        201:  
          description: Criado 
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/Pedido'
        400:  
          description: Erro de validação 
        401:  
          description: Token inválido ou ausente 
        403:  
          description: Sem permissão 
  /api/pedidos/{id}:
    get:
      summary: Busca pedido por ID
      security: 
       bearerAuth: [] 
      tags: [Pedidos]
      parameters:
        - in: path
          name: id
          required: true
          schema: 
            type: string 
          example: "ped-001"
      responses:
        200:
          description: OK
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/Pedido'

        401: 
          description: Token inválido ou ausente 
        403: 
          description: Sem permissão 
        404: 
          description: Não encontrado 
    put:
      summary: Atualiza pedido
      security: 
       bearerAuth: [] 
      tags: [Pedidos]
      parameters:
        - in: path
          name: id
          required: true
          schema: 
           type: string 
          example: "ped-001"
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/UpdatePedido' 
            examples:
              atualizarStatus: 
                summary: Marcar pedido como pago
                value: 
                 status: PAGO
              atualizarItens: 
                summary: Atualizar itens do pedido
                value: 
                  itens:
                    - pratoId: "p-100"
                      quantidade: 3
                      precoUnitario: 29.90
      responses:
        200: 
          description: OK 
          content: 
            application/json: 
              schema:
                $ref: '#/components/schemas/Pedido'
        400: 
          description: Erro de validação 
        401: 
          description: Token inválido ou ausente 
        403: 
          description: Sem permissão 
        404: 
          description: Não encontrado 
    delete:
      summary: Remove pedido
      security: 
        bearerAuth: [] 
      tags: [Pedidos]
      parameters:
        - in: path
          name: id
          required: true
          schema: 
            type: string 
          example: "ped-001"
      responses:
        204: 
          description: Sem conteúdo 
        401: 
          description: Token inválido ou ausente 
        403: 
          description: Sem permissão 
        404: 
          description: Não encontrado 
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - nome
        - senha
        - email
        - role
      properties:
        nome:
          type: string
          description: O nome de usuário
        senha:
          type: string
          description: A senha do usuário
        email:
          type: string
          description: O email do usuário
        role:
          type: string
          description: O papel do usuário no sistema
      example:
        id: 1
        nome: "João da Silva"
        senha: "123abc"
        email: "joao.silva@dominio.com"
        role: "Gerente"
    Prato:
      type: object
      required:
        - nome
        - descricao
        - preco
      properties:
        nome:
          type: string
          description: O nome do prato
        descricao:
          type: string
          description: A descrição do prato
        preco:
          type: number
          format: float
          description: O preço do prato
      example:
        id: 1
        nome: "Lasanha"
        descricao: "Lasanha à bolonhesa com queijo gratinado"
        preco: 29.90
    Login:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          description: O email do usuário
        senha:
          type: string
          description: A senha do usuário
      example:
        email: "joao.silva@dominio.com"
        senha: "123abc"
    RefreshToken:
      type: string
      description: Token JWT para autenticação
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    PedidoItem:
      type: object
      properties:
        pratoId:
          type: integer
          description: O ID do prato
        quantidade:
          type: integer
          description: A quantidade do prato no pedido
          minimum: 1
        precoUnitario:
          type: number
          description: O preço unitário do prato no momento do pedido
          example: 29.90
      required:
        - pratoId
        - quantidade 
        - precoUnitario
      example:
        pratoId: 1
        quantidade: 2
    Pedido:
      type: object
      properties:
        id:  
          type: string
        usuarioId:  
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
        total:  
          type: number
        status:  
          type: string
          enum: [CRIADO, PAGO, CANCELADO, ENVIADO]
        createdAt:  
          type: string
          format: date-time
        updatedAt:  
          type: string
          format: date-time
      example:
        id: "p-123"
        usuarioId: "u-123"
    CreatePedido:
      type: object
      properties:
        usuarioId:  
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
      required: 
        - usuarioId 
        - itens
      example:
        usuarioId: "u-123"
        itens:
          - pratoId: "p-100"
            quantidade: 2
            precoUnitario: 29.90
    UpdatePedido:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
        status:  
          type: string
          enum: [CRIADO, PAGO, CANCELADO, ENVIADO]
      example:
        status: PAGO
